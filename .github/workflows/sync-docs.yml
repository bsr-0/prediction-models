name: Sync sub-project docs

on:
  schedule:
    - cron: '0 13 * * 2'   # Tuesdays 1pm UTC — after the weekly NFL refresh
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub repo
        uses: actions/checkout@v4

      - name: Checkout nfl-player-projections docs
        uses: actions/checkout@v4
        with:
          repository: bsr-0/nfl-player-projections
          sparse-checkout: docs
          sparse-checkout-cone-mode: false
          path: _src_nfl

      - name: Checkout march-madness-forecaster docs
        uses: actions/checkout@v4
        with:
          repository: bsr-0/march-madness-forecaster
          sparse-checkout: docs
          sparse-checkout-cone-mode: false
          path: _src_madness

      # Each project's site lands at the SAME path it has in a local checkout
      # of this hub (madness/march-madness-forecaster/docs/, nfl/nfl-player-
      # projections/docs/), so index.html's links work on disk and on Pages
      # alike. Only docs/ is copied: the model code stays in the source repos.
      - name: Sync into hub folders
        run: |
          mkdir -p nfl/nfl-player-projections madness/march-madness-forecaster
          rsync -a --delete _src_nfl/docs/ nfl/nfl-player-projections/docs/
          rsync -a --delete _src_madness/docs/ madness/march-madness-forecaster/docs/
          rm -rf _src_nfl _src_madness

      - name: Warn on large files (informational only, does not block push)
        run: |
          echo "Files over 5MB in synced output:"
          find nfl/nfl-player-projections/docs madness/march-madness-forecaster/docs -type f -size +5M -exec ls -lh {} \; || true

      - name: Commit if changed
        run: |
          git config user.name "docs-sync-bot"
          git config user.email "actions@github.com"
          # -f: the parent folders are ignored (see .gitignore); only docs/ is wanted.
          git add -f nfl/nfl-player-projections/docs madness/march-madness-forecaster/docs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Sync docs from source repos ($(date -u +%Y-%m-%d))"
          git push
