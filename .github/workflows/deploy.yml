name: Deploy site

# Assembles the hub site from the two source repos and deploys it to GitHub
# Pages via Actions. Nothing is committed back to this repo: each project's
# site lives in its own repo (docs/ or site/) and is pulled at deploy time.
# Mirrors scripts/build.sh, which does the same from the local sibling checkouts.
#
# Triggers: push to main, or a manual run from the Actions tab. Nothing runs
# on a schedule and no source repo triggers this automatically; after pushing
# new data to a source repo, run this workflow by hand to publish it.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4

      - name: Checkout nfl-player-projections docs
        uses: actions/checkout@v4
        with:
          repository: bsr-0/nfl-player-projections
          sparse-checkout: docs
          sparse-checkout-cone-mode: false
          path: _src/nfl

      - name: Checkout march-madness-forecaster docs
        uses: actions/checkout@v4
        with:
          repository: bsr-0/march-madness-forecaster
          sparse-checkout: docs
          sparse-checkout-cone-mode: false
          path: _src/madness

      - name: Assemble site
        run: |
          scripts/build.sh _src/nfl/docs _src/madness/docs
          echo "Site size:"; du -sh _site
          echo "Files over 5MB:"; find _site -type f -size +5M -exec ls -lh {} \; || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
